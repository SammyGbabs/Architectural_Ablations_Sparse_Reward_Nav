# =============================================================================
# configs/p2_proxnoise_sym.yaml
# Phase 2 CLAIM-GRADE cell — PROXIMITY NOISE q=0.3 (13-D), SYMMETRIC, 10 seeds.
# Closing rung of the ladder (lowest priority). Single-seed gate ceilinged (IQM 27.80,
# 100% all rooms, converged ~80k) and collision_rate -> 0, so NOT a collision-floor.
# Multi-seed confirms the ceiling and (via collision_rate) that noise is absorbed.
# Hyperparameters VERBATIM from ppo_exp1.yaml. Only obs_rung + prox_q differ.
# =============================================================================

config_id: p2_proxnoise_sym
phase: p2                  # per-seed CSV -> <out>/csv/p2_proxnoise_sym.csv
algo: ppo
policy: MlpPolicy

net_arch:
  pi: [256, 256]
  vf: [256, 256]
activation_fn: ReLU
ortho_init: true

lr: 0.0002
gamma: 0.990
batch_size: 256
n_steps: 2048
n_epochs: 10
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.020

n_seeds: 10
env_steps: 200000          # converged ~80k single-seed; 200k = ample margin

eval_freq: 20000
eval_episodes: 15

# --- Phase 2 observation wrapper ---
obs_rung: rung5            # A-STRICT + proximity-noise(q) -> 13-D
prox_q: 0.3
